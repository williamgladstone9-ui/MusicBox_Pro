server {
    listen 80;
    server_name musicbox.lan musicbox.local music.lan _;

    client_max_body_size 250M;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # MPD built-in HTTP stream. Works for local-library MPD playback.
    location /stream.mp3 {
        proxy_pass http://127.0.0.1:8001/;
        proxy_buffering off;
    }

    # Optional Icecast-fed universal stream. Can include MPD, Spotify Connect, and AirPlay
    # if scripts/setup-audio-mix.sh and scripts/start-live-stream.sh are running.
    location /live.mp3 {
        proxy_pass http://127.0.0.1:8000/musicbox.mp3;
        proxy_buffering off;
    }
}
