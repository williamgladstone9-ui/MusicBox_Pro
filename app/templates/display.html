<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MusicBox Display</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:white;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.stage{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#173,#111 45%,#000)}.clock{position:absolute;top:24px;right:32px;color:rgba(255,255,255,.35);font-size:28px}.mode{position:absolute;top:24px;left:32px;color:#1db954;font-size:22px}.art{width:34vh;height:34vh;border-radius:38px;background:linear-gradient(135deg,#1db954,#123,#000);display:flex;align-items:center;justify-content:center;font-size:13vh;box-shadow:0 20px 80px rgba(29,185,84,.25)}.title{margin-top:32px;font-size:5vw;font-weight:800;text-align:center;max-width:90%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.artist{margin-top:12px;color:#1db954;font-size:2.7vw;text-align:center}.bars{height:18vh;display:flex;align-items:flex-end;gap:.45vw;margin-top:4vh}.bar{width:1vw;min-width:5px;border-radius:6px 6px 0 0;background:linear-gradient(to top,#1db954,#9fdfb5);height:2vh;transition:height .12s}</style>
</head>
<body><div class="stage"><div class="clock" id="clock"></div><div class="mode" id="mode">MusicBox</div><div class="art">♫</div><div class="title" id="title">MusicBox Pro</div><div class="artist" id="artist">Ready</div><div class="bars" id="bars"></div></div>
<script>
var bars=[],playing=false;var b=document.getElementById('bars');for(var i=0;i<36;i++){var x=document.createElement('div');x.className='bar';b.appendChild(x);bars.push(x);}function xhr(url,cb){var x=new XMLHttpRequest();x.open('GET',url,true);x.onreadystatechange=function(){if(x.readyState===4){try{cb(JSON.parse(x.responseText));}catch(e){}}};x.send();}
function tick(){var d=new Date();document.getElementById('clock').textContent=d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});}function update(){xhr('/api/status',function(r){if(r.ok){var s=r.status||{},song=r.song||{};playing=s.state==='play';document.getElementById('title').textContent=song.title||song.file||'MusicBox Pro';document.getElementById('artist').textContent=song.artist||song.album||'Ready';}});xhr('/api/system',function(r){if(r.ok){document.getElementById('mode').textContent=(r.source_mode||'local')+' · '+(r.internet?'online':'offline');}});}function anim(){for(var i=0;i<bars.length;i++){var h=playing?(Math.random()*16+2):2;bars[i].style.height=h+'vh';}setTimeout(anim,140);}tick();update();anim();setInterval(tick,1000);setInterval(update,2500);
</script></body></html>
