music_directory       "/srv/musicbox/music/library"
playlist_directory    "/srv/musicbox/music/playlists"
db_file               "/srv/musicbox/mpd/database"
log_file              "/srv/musicbox/mpd/log"
pid_file              "/srv/musicbox/mpd/pid"
state_file            "/srv/musicbox/mpd/state"
sticker_file          "/srv/musicbox/mpd/sticker.sql"

# Change this if your MPD package uses a different user.
user                  "music"

bind_to_address       "0.0.0.0"
port                  "6600"
restore_paused        "yes"
auto_update           "yes"

# Local Surface speakers via PipeWire's Pulse compatibility layer.
audio_output {
    type        "pulse"
    name        "Surface Speakers"
    mixer_type  "software"
}

# Browser speaker mode stream for local MPD music.
audio_output {
    type        "httpd"
    name        "Phone Stream MP3"
    encoder     "lame"
    port        "8001"
    bitrate     "160"
    format      "44100:16:2"
    always_on   "yes"
    tags        "yes"
}
